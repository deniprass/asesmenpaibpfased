    <script>
      (function() {
        // Prevent Vite HMR WebSocket from throwing unhandled disconnection errors in AI Studio iframe
        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('@vite') !== -1))
              ) {
                // Return a harmless dummy WebSocket that never triggers uncaught errors
                var noop = function() {};
                var dummy = {
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  protocol: protocols || '',
                  readyState: 3, // CLOSED
                  url: url,
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  send: noop,
                  close: noop,
                  addEventListener: noop,
                  removeEventListener: noop,
                  dispatchEvent: function() { return false; }
                };
                return dummy;
              }
              return new (Function.prototype.bind.apply(OriginalWebSocket, [null].concat(Array.prototype.slice.call(arguments))));
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {
          // Ignore
        }

        // Global capture-phase error & unhandled rejection suppression for Vite HMR
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1 || reason.indexOf('@vite/client') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        });
      })();
    </script>
